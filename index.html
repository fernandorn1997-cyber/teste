<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Texto Compartilhado em Tempo Real</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 800px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h1 { color: #333; margin-top: 0; font-size: 24px; }
        .status {
            font-size: 14px;
            margin-bottom: 15px;
            padding: 8px 12px;
            border-radius: 6px;
            display: inline-block;
        }
        .connecting { background-color: #ffeeba; color: #856404; }
        .ready { background-color: #d4edda; color: #155724; }
        textarea {
            width: 100%;
            height: 400px;
            padding: 15px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 16px;
            line-height: 1.6;
            resize: vertical;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }
        textarea:focus { border-color: #3b82f6; }
        textarea:disabled { background-color: #f8fafc; cursor: not-allowed; }
        .footer {
            margin-top: 15px;
            font-size: 12px;
            color: #64748b;
            text-align: right;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📝 Bloco de Notas Colaborativo</h1>
    <div id="statusLabel" class="status connecting">Conectando ao servidor...</div>
    
    <textarea id="editor" disabled placeholder="Comece a digitar aqui... Qualquer pessoa com o link desta sala verá suas alterações em tempo real!"></textarea>
    
    <div class="footer">Link único desta sala gerado automaticamente na barra de endereços.</div>
</div>

<script>
// =======================================================================
// 1. CONFIGURAÇÃO DO SUPABASE 100% CORRETA E ATUALIZADA
// =======================================================================
const SUPABASE_URL = "https://npwzmfhboskcksnanxwe.supabase.co"; 
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5wd3ptZmhib3NrY2tzbmFueHdlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMzcwNzUsImV4cCI6MjA5NjYxMzA3NX0.7qgudKe67CBEF6JdVTQq-S4c1msPL25vHjezwfbkqug";
// =======================================================================

const supabase = Supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ==========================================
// 2. LÓGICA DA SALA EM TEMPO REAL
// ==========================================
const editor = document.getElementById('editor');
const statusLabel = document.getElementById('statusLabel');

const urlParams = new URLSearchParams(window.location.search);
let salaId = urlParams.get('id');

if (!salaId) {
    salaId = 'sala-' + Math.random().toString(36).substring(2, 9);
    urlParams.set('id', salaId);
    window.history.replaceState({}, '', window.location.pathname + '?' + urlParams.toString());
}

let ultimaVersaoTexto = "";
let digitandoTimeout;

async function carregarTextoInicial() {
    try {
        let { data, error } = await supabase
            .from('salas')
            .select('texto')
            .eq('id', salaId)
            .single();

        if (error && error.code === 'PGRST116') {
            await supabase.from('salas').insert([{ id: salaId, texto: "" }]);
            ultimaVersaoTexto = "";
            editor.value = "";
        } else if (data) {
            ultimaVersaoTexto = data.texto;
            editor.value = data.texto;
        }
        
        editor.disabled = false;
        statusLabel.innerText = "Sincronizado e pronto.";
        statusLabel.className = "status ready";
    } catch (err) {
        console.error(err);
        statusLabel.innerText = "Erro ao conectar. Verifique as credenciais.";
    }
}

async function salvarNoBanco(novoTexto) {
    if (novoTexto === ultimaVersaoTexto) return;
    ultimaVersaoTexto = Rails.escape ? novoTexto : novoTexto;

    await supabase
        .from('salas')
        .update({ texto: novoTexto, atualizado_em: new Date() })
        .eq('id', salaId);
}

editor.addEventListener('input', (e) => {
    clearTimeout(digitandoTimeout);
    statusLabel.innerText = "Digitando e salvando...";
    statusLabel.className = "status connecting";
    
    digitandoTimeout = setTimeout(() => {
        salvarNoBanco(e.target.value);
        statusLabel.innerText = "Sincronizado e pronto.";
        statusLabel.className = "status ready";
    }, 500);
});

const canal = supabase
    .channel(`mudancas-sala-${salaId}`)
    .on('postgres_changes', { event: 'UPDATE', filter: `id=eq.${salaId}`, schema: 'public', table: 'salas' }, payload => {
        if (payload.new && payload.new.texto !== editor.value) {
            const cursorPosition = editor.selectionStart;
            editor.value = payload.new.texto;
            ultimaVersaoTexto = payload.new.texto;
            editor.setSelectionRange(cursorPosition, cursorPosition);
        }
    })
    .subscribe((status) => {
        if (status === 'SUBSCRIBED') {
            carregarTextoInicial();
        }
    });
</script>

</body>
</html>
